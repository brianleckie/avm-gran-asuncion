[project]
name = "avm-gran-asuncion"
version = "0.1.0"
description = "Automated Valuation Model del precio de oferta por m² en el Gran Asunción."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Brian Leckie" }, { name = "Oscar Arce" }]
# httpx (cliente HTTP) y selectolax (parser HTML) son runtime desde F3.2/F3.4: los usa avm.scraping.
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2",
    "pydantic>=2",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.0",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
# Sin pinear: las versiones exactas las fija uv.lock. Runtime mínimo; el resto entra cuando una tarea lo necesite.
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "hypothesis",
    "coverage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# El nombre del proyecto (avm-gran-asuncion) no coincide con el paquete (avm): hay que indicarlo.
[tool.hatch.build.targets.wheel]
packages = ["src/avm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# NO usar `strict = true` dentro de [[tool.mypy.overrides]]: no falla, pero mypy 2.3.1 lo aplica a
# todos los módulos (comprobado). Por eso strict va global y mypy se corre solo sobre
# src/avm/contract (ver `files`). Correr `mypy src/` o `mypy .` tipa todo en modo estricto.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/avm/contract"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/: para testear scripts/recon (F3.1) sin empaquetarlo.
pythonpath = ["src", "scripts"]
