name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv no publica un tag flotante v10: se pinea la versión exacta.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked falla si uv.lock no está al día con pyproject.toml.
      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy (contract, modo estricto)
        run: uv run mypy src/avm/contract

      - name: pytest
        run: uv run pytest --cov=avm.pipeline.parsing --cov=avm.model.metrics --cov=avm.model.splits --cov-branch --cov-report=

      # Cobertura ≥ 95 % (líneas y ramas) por módulo, no sobre el total combinado: un total puede
      # esconder un módulo flojo detrás de otro al 100 %. Sale con error si falta cobertura o datos.
      - name: cobertura por módulo (≥ 95 %)
        run: |
          uv run coverage report --show-missing --include=src/avm/pipeline/parsing.py --fail-under=95
          uv run coverage report --show-missing --include=src/avm/model/metrics.py --fail-under=95
          uv run coverage report --show-missing --include=src/avm/model/splits.py --fail-under=95
